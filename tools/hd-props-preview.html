<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Obsidian Spire: HD props preview</title>
<style>
  html, body { margin: 0; height: 100%; background: #120d0c; overflow: hidden; }
  canvas { display: block; }
  #ui {
    position: fixed; left: 10px; top: 8px; display: flex; flex-wrap: wrap; gap: 6px; max-width: calc(100% - 20px);
    font: 12px/1.3 ui-sans-serif, system-ui, sans-serif;
  }
  #ui button {
    background: rgba(18, 13, 12, 0.72); color: #e8d8c0; border: 1px solid rgba(232, 216, 192, 0.25);
    border-radius: 5px; padding: 5px 9px; cursor: pointer; font: inherit;
  }
  #ui button.on { border-color: #e6b54a; color: #ffe2a0; }
  #hud {
    position: fixed; right: 10px; top: 8px; color: #d8c8b0; font: 11px/1.4 ui-monospace, Menlo, Consolas, monospace;
    background: rgba(12, 9, 7, 0.75); padding: 8px 10px; border-radius: 6px; white-space: pre; pointer-events: none;
  }
  #hud.hidden, #ui.hidden { display: none; }
</style>
<script type="importmap">
{"imports":{"three":"../vendor/three.module.min.js","three/addons/":"../vendor/addons/"}}
</script>
</head>
<body>
<div id="ui"></div>
<div id="hud" class="hidden"></div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { VEGETATION, PROPS, makeVegetation, makeProp, makeShard } from '../js/fp/hd/props-hd.js';

// Query options:
//   ?shot=overview|groves|props|propsL|propsR|shards|dungeon|veg:<kind>|prop:<kind>
//   ?t=SECONDS   freeze animation time      ?bloom=0   no bloom pass
//   ?labels=0    hide name tags             ?hud=1     triangle counts
//   ?env=0       no sky image lighting      ?ui=0      hide the buttons
//   ?sun=DEG     sun elevation (default 9)  ?cam=x,y,z&look=x,y,z   free camera
const q = new URLSearchParams(location.search);
const frozenT = q.has('t') ? parseFloat(q.get('t')) : null;
const useBloom = q.get('bloom') !== '0';
const useEnv = q.get('env') !== '0';
const sunElev = parseFloat(q.get('sun') || '9');

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = parseFloat(q.get('exposure') || '0.85');
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.05, 900);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.495;
controls.addEventListener('start', () => { if (!controls.__moved) { controls.__moved = true; requestAnimationFrame(frame); } });

/* ---------------------------------------------------------------- noise */
function hash(x, y, s) {
  let h = Math.imul(x | 0, 0x27d4eb2d) ^ Math.imul(y | 0, 0x165667b1) ^ Math.imul((s | 0) + 7, 0x85ebca6b);
  h = Math.imul(h ^ (h >>> 15), 0x2c1b3c6d); h = Math.imul(h ^ (h >>> 12), 0x297a2d39); h ^= h >>> 15;
  return (h >>> 0) / 4294967296;
}
const mod = (a, n) => ((a % n) + n) % n;
function tnoise(x, y, p, s) {
  const xi = Math.floor(x), yi = Math.floor(y), u = x - xi, v = y - yi, fu = u * u * (3 - 2 * u), fv = v * v * (3 - 2 * v);
  const a = hash(mod(xi, p), mod(yi, p), s), b = hash(mod(xi + 1, p), mod(yi, p), s), c = hash(mod(xi, p), mod(yi + 1, p), s), d = hash(mod(xi + 1, p), mod(yi + 1, p), s);
  return a + (b - a) * fu + (c - a) * fv + (a - b - c + d) * fu * fv;
}
function tfbm(u, v, p, oct, s) { let sum = 0, amp = 1, n = 0; for (let i = 0; i < oct; i++) { sum += amp * tnoise(u * p, v * p, p, s + i); n += amp; amp *= 0.5; p *= 2; } return sum / n; }
function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6d2b79f5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

// Colour + normal canvas textures from a per-pixel function.
function makeTex(size, fn, k, repeat) {
  const col = document.createElement('canvas'), nrm = document.createElement('canvas');
  col.width = col.height = nrm.width = nrm.height = size;
  const cx = col.getContext('2d'), nx = nrm.getContext('2d');
  const ci = cx.createImageData(size, size), ni = nx.createImageData(size, size), H = new Float32Array(size * size), o = {};
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    fn(x / size, y / size, o);
    const i = y * size + x; H[i] = o.h;
    ci.data.set([o.r * 255, o.g * 255, o.b * 255, 255], i * 4);
  }
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    const at = (a, b) => H[mod(b, size) * size + mod(a, size)];
    const dx = (at(x + 1, y) - at(x - 1, y)) * k, dy = (at(x, y + 1) - at(x, y - 1)) * k, l = Math.hypot(dx, dy, 1);
    ni.data.set([(-dx / l * 0.5 + 0.5) * 255, (dy / l * 0.5 + 0.5) * 255, (1 / l * 0.5 + 0.5) * 255, 255], (y * size + x) * 4);
  }
  cx.putImageData(ci, 0, 0); nx.putImageData(ni, 0, 0);
  const t = (c, srgb) => { const tx = new THREE.CanvasTexture(c); tx.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace; tx.wrapS = tx.wrapT = THREE.RepeatWrapping; tx.repeat.set(repeat, repeat); tx.anisotropy = 8; return tx; };
  return { map: t(col, true), normalMap: t(nrm, false) };
}

/* ------------------------------------------------------------------ sky */
const sunDir = new THREE.Vector3().setFromSphericalCoords(1, THREE.MathUtils.degToRad(90 - sunElev), THREE.MathUtils.degToRad(-58));
const DUSK_FOG = new THREE.Color('#7d6470');
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(600, 32, 16),
  new THREE.ShaderMaterial({
    uniforms: { uSun: { value: sunDir }, uHorizon: { value: new THREE.Color('#e49a62') }, uMid: { value: new THREE.Color('#8a5c76') }, uZenith: { value: new THREE.Color('#1d2448') } },
    vertexShader: 'varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
    fragmentShader: `uniform vec3 uSun, uHorizon, uMid, uZenith; varying vec3 vDir;
      void main(){ vec3 d = normalize(vDir); float h = d.y;
        float s = max(dot(d, uSun), 0.0);
        vec3 hor = mix(uHorizon * 0.75, uHorizon * 1.15, pow(s, 3.0));
        vec3 c = mix(hor, uMid, smoothstep(0.0, 0.22, h)); c = mix(c, uZenith, smoothstep(0.18, 0.75, h));
        c += vec3(1.0, 0.75, 0.45) * (pow(s, 900.0) * 30.0 + pow(s, 24.0) * 0.5);
        if (h < 0.0) c = mix(hor, uHorizon * 0.35, smoothstep(0.0, -0.2, h));
        gl_FragColor = vec4(c, 1.0); }`,
    side: THREE.BackSide, depthWrite: false, fog: false,
  }),
);
sky.renderOrder = -10;
scene.add(sky);

const hemi = new THREE.HemisphereLight('#b9b4e6', '#4a3424', 0.6);
scene.add(hemi);
const sun = new THREE.DirectionalLight('#ffc38a', 2.8);
sun.position.copy(sunDir).multiplyScalar(90);
sun.target.position.set(0, 0, -6);
sun.castShadow = true;
const smap = parseInt(q.get('shadow') || '4096', 10);
sun.shadow.mapSize.set(smap, smap);
Object.assign(sun.shadow.camera, { left: -46, right: 46, top: 34, bottom: -34, near: 1, far: 220 });
sun.shadow.bias = -0.0005;
sun.shadow.normalBias = 0.04;
scene.add(sun, sun.target);

// Image-based lighting from the sky, as the game does.
let envTex = null;
if (useEnv) {
  const pm = new THREE.PMREMGenerator(renderer);
  const envScene = new THREE.Scene();
  envScene.add(sky.clone());
  envTex = pm.fromScene(envScene, 0, 1, 1000).texture;
}

/* --------------------------------------------------------------- ground */
const groundTex = makeTex(512, (u, v, o) => {
  const n = tfbm(u, v, 6, 5, 3), f = tfbm(u, v, 48, 2, 9), g = tnoise(u * 160, v * 160, 160, 13);
  const dirt = Math.min(1, Math.max(0, (n - 0.5) * 4 + 0.35));
  const L = 0.7 + 0.25 * (f - 0.5) + 0.25 * (g - 0.5);
  o.r = (0.36 * (1 - dirt) + 0.46 * dirt) * L; o.g = (0.4 * (1 - dirt) + 0.36 * dirt) * L; o.b = (0.2 * (1 - dirt) + 0.26 * dirt) * L;
  o.h = f * 0.5 + g * 0.5;
}, 3, 90);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(420, 420), new THREE.MeshStandardMaterial({ ...groundTex, roughness: 0.95 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

/* ----------------------------------------------------------- labels */
const labels = [];
function label(text, x, y, z, s = 1) {
  const c = document.createElement('canvas'); c.width = 256; c.height = 64;
  const g = c.getContext('2d');
  g.fillStyle = 'rgba(14,10,9,0.7)'; g.beginPath(); g.roundRect(4, 10, 248, 44, 10); g.fill();
  g.fillStyle = '#f2dcb4'; g.font = '600 26px system-ui, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(text, 128, 33);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, depthWrite: false, fog: false, toneMapped: false }));
  sp.scale.set(1.6 * s, 0.4 * s, 1);
  sp.position.set(x, y, z);
  sp.renderOrder = 10;
  scene.add(sp);
  labels.push(sp);
}

/* ---------------------------------------------------------- vegetation */
const SIZE = { pine: 7, snowpine: 7, oak: 6, deadtree: 5, cactus: 2.5, reeds: 1.4, mushroom: 0.6, rock: 0.8, boulder: 2.2, standingstone: 3, grasstuft: 0.4, bush: 1.2 };
const GROVES = {
  pine: [-27, -21, 4.6, 7], snowpine: [-16, -22, 4.6, 7], oak: [-4, -22, 5.2, 6], deadtree: [8, -21, 4.2, 6], cactus: [18, -20, 3.4, 8], boulder: [27.5, -19, 4.2, 6],
  reeds: [-17.5, -7.5, 1.7, 10], mushroom: [-10.5, -7, 1.1, 8], rock: [-4, -7, 1.9, 9], grasstuft: [2.5, -7, 1.5, 10], bush: [9.5, -7.5, 2.3, 6], standingstone: [17.5, -8, 3.2, 5],
};
const tris = {};
const spots = {};
const dummy = new THREE.Object3D();
for (const kind of VEGETATION) {
  const [cx, cz, r, n] = GROVES[kind];
  const R = rng(kind.length * 977 + kind.charCodeAt(0));
  const pts = [];
  const minD = Math.max(0.25, SIZE[kind] * (kind.endsWith('pine') || kind === 'oak' ? 0.42 : 0.55));
  for (let tries = 0; pts.length < n && tries < 400; tries++) {
    const a = R() * Math.PI * 2, d = Math.sqrt(R()) * r;
    const p = [cx + Math.cos(a) * d, cz + Math.sin(a) * d];
    if (pts.every((o) => Math.hypot(o[0] - p[0], o[1] - p[1]) > minD)) pts.push(p);
  }
  const parts = makeVegetation(kind);
  tris[kind] = parts.reduce((s, p) => s + p.geometry.attributes.position.count / 3, 0);
  const mats = pts.map(([x, z], i) => {
    dummy.position.set(x, -0.03, z);
    dummy.rotation.set(0, R() * Math.PI * 2, 0);
    dummy.scale.setScalar(i === 0 ? 1 : 0.8 + R() * 0.4);
    dummy.updateMatrix();
    return dummy.matrix.clone();
  });
  const tints = pts.map(() => new THREE.Color().setScalar(0.88 + R() * 0.2));
  for (const part of parts) {
    const im = new THREE.InstancedMesh(part.geometry, part.material, pts.length);
    mats.forEach((m, i) => { im.setMatrixAt(i, m); im.setColorAt(i, tints[i]); });
    im.instanceMatrix.needsUpdate = true;
    im.castShadow = true;
    im.receiveShadow = true;
    im.computeBoundingSphere();
    scene.add(im);
  }
  spots['veg:' + kind] = { x: pts[0][0], z: pts[0][1], size: SIZE[kind], grove: [cx, cz, r] };
  label(`${kind}  ×${pts.length}`, cx, SIZE[kind] + 0.9, cz, kind.length > 8 || SIZE[kind] > 2 ? 1.6 : 1.0);
}

/* --------------------------------------------------------------- props */
const animated = [];
const WIDTH = { campfire: 1.7, torch: 1.4, chest: 1.1, chestopen: 1.3, altar: 2.5, signpost: 1.9, crate: 1.0, barrel: 0.9, bannerCrimson: 1.2, bannerAzure: 1.2, well: 2.3, cart: 3.3, bones: 1.0, brazier: 1.1 };
const HEIGHT = { campfire: 1, torch: 1.3, chest: 0.8, chestopen: 1.2, altar: 1.3, signpost: 2.4, crate: 0.8, barrel: 1, bannerCrimson: 3.1, bannerAzure: 3.1, well: 2.5, cart: 1.4, bones: 0.3, brazier: 1.4 };
const GAP = 0.9;
const total = PROPS.reduce((s, k) => s + WIDTH[k], 0) + GAP * (PROPS.length - 1);
let px = -total / 2;
const PROW = 4;
const wallMat = (() => {
  const t = makeTex(256, (u, v, o) => {
    const rows = 4, row = Math.floor(v * rows), lv = v * rows - row;
    const bu = u * 2 + (row % 2) * 0.5, bx = Math.floor(bu), lu = bu - bx;
    const mortar = lv < 0.05 || lv > 0.95 || lu < 0.025 || lu > 0.975;
    const n = tfbm(u, v, 8, 4, 31), tone = 0.8 + hash(bx & 1, row, 33) * 0.3;
    const edge = Math.min(lv, 1 - lv, lu * 2, (1 - lu) * 2);
    o.h = mortar ? 0 : 0.4 + 0.4 * Math.min(1, edge * 8) + 0.2 * n;
    const L = mortar ? 0.22 : tone * (0.58 + 0.35 * n);
    o.r = L * 1.0; o.g = L * 0.95; o.b = L * 0.88;
  }, 5, 1);
  return t;
})();
function wallPiece(w, h, d, repeatScale = 0.5) {
  const m = new THREE.MeshStandardMaterial({ ...wallMat, color: '#bdb2a4', roughness: 0.9 });
  m.map = wallMat.map.clone(); m.normalMap = wallMat.normalMap.clone();
  for (const t of [m.map, m.normalMap]) { t.needsUpdate = true; t.repeat.set(w * repeatScale, h * repeatScale); }
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);
  mesh.castShadow = mesh.receiveShadow = true;
  return mesh;
}
for (const kind of PROPS) {
  const x = px + WIDTH[kind] / 2;
  px += WIDTH[kind] + GAP;
  const obj = makeProp(kind);
  if (kind === 'torch') {
    const wall = wallPiece(1.2, 2.4, 0.5);
    wall.position.set(x, 1.2, PROW - 0.25);
    scene.add(wall);
    obj.position.set(x, 1.0, PROW);
  } else if (kind === 'cart') {
    obj.position.set(x - 0.5, 0, PROW);
  } else {
    obj.position.set(x, 0, PROW);
  }
  if (kind === 'chestopen' || kind === 'chest') obj.rotation.y = -0.25;
  if (kind === 'signpost') obj.rotation.y = 0.4;
  scene.add(obj);
  if (obj.userData.update) animated.push(obj);
  let t = 0;
  obj.traverse((o) => { if (o.isMesh && !o.userData.noShadow) t += (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3; });
  tris[kind] = Math.round(t);
  spots['prop:' + kind] = { x, z: PROW, size: Math.max(HEIGHT[kind], WIDTH[kind] * 0.8), y0: kind === 'torch' ? 1 : 0 };
  label(kind, x, (kind === 'torch' ? 1 : 0) + HEIGHT[kind] + 0.45, PROW, 0.8);
}

/* -------------------------------------------------------------- shards */
['sun', 'moon', 'star'].forEach((id, i) => {
  const s = makeShard(id);
  s.position.set((i - 1) * 1.6, 0, 8.5);
  scene.add(s);
  animated.push(s);
  label('shard ' + id, (i - 1) * 1.6, 1.25, 8.5, 0.7);
  let t = 0;
  s.traverse((o) => { if (o.isMesh) t += o.geometry.attributes.position.count / 3; });
  tris['shard:' + id] = t;
});

/* ------------------------------------------------------------- dungeon */
const DZ = 70;
const dungeon = new THREE.Group();
scene.add(dungeon);
const flagTex = makeTex(256, (u, v, o) => {
  const g = 3, cu = u * g, cv = v * g, ix = Math.floor(cu), iy = Math.floor(cv), lu = cu - ix, lv = cv - iy;
  const jitter = hash(ix, iy, 41) * 0.2;
  const mortar = lu < 0.03 || lu > 0.97 || lv < 0.03 || lv > 0.97 || (hash(ix, iy, 43) > 0.6 && Math.abs(lu - 0.5 - jitter) < 0.015);
  const n = tfbm(u, v, 8, 4, 45), tone = 0.75 + hash(ix, iy, 47) * 0.35;
  const edge = Math.min(lu, 1 - lu, lv, 1 - lv);
  o.h = mortar ? 0 : 0.5 + 0.3 * Math.min(1, edge * 10) + 0.2 * n;
  const L = mortar ? 0.15 : tone * (0.5 + 0.35 * n);
  o.r = L; o.g = L * 0.95; o.b = L * 0.9;
}, 4, 1);
{
  const fm = new THREE.MeshStandardMaterial({ ...flagTex, color: '#a8a096', roughness: 0.85 });
  for (const t of [fm.map, fm.normalMap]) t.repeat.set(4, 4);
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(12, 12), fm);
  floor.rotation.x = -Math.PI / 2; floor.position.set(0, 0.01, DZ + 3); floor.receiveShadow = true;
  dungeon.add(floor);
  const back = wallPiece(12, 4.2, 0.6); back.position.set(0, 2.1, DZ - 0.3); dungeon.add(back);
  const left = wallPiece(0.6, 4.2, 12); left.position.set(-4.3, 2.1, DZ + 6); dungeon.add(left);
  left.material.map.repeat.set(6, 2.1); left.material.normalMap.repeat.set(6, 2.1);
  const ceil = new THREE.Mesh(new THREE.PlaneGeometry(12, 12), new THREE.MeshStandardMaterial({ color: '#2a2622', roughness: 1 }));
  ceil.rotation.x = Math.PI / 2; ceil.position.set(0, 4.2, DZ + 3); dungeon.add(ceil);
  const torch = makeProp('torch');
  torch.position.set(0.4, 1.35, DZ);
  dungeon.add(torch); animated.push(torch);
  torch.userData.light.castShadow = q.get('torchshadow') !== '0';
  torch.userData.light.shadow.mapSize.set(512, 512);
  torch.userData.light.shadow.bias = -0.004;
  torch.userData.light.shadow.normalBias = 0.02;
  torch.userData.light.shadow.camera.near = 0.15;
  const place = (kind, x, z, ry = 0) => { const o = makeProp(kind); o.position.set(x, 0, DZ + z); o.rotation.y = ry; dungeon.add(o); if (o.userData.update) animated.push(o); return o; };
  place('chestopen', -1.6, 1.0, 0.35);
  place('bones', 0.9, 1.6, 0.6);
  place('barrel', -3.4, 1.4);
  place('crate', -3.35, 2.55, 0.2);
  place('chest', 2.7, 0.9, -0.5);
  const rockParts = makeVegetation('rock');
  for (const [x, z, s] of [[1.9, 2.3, 0.5], [-2.6, 3.4, 0.35]]) {
    for (const p of rockParts) { const m = new THREE.Mesh(p.geometry, p.material); m.position.set(x, 0, DZ + z); m.scale.setScalar(s); m.castShadow = m.receiveShadow = true; dungeon.add(m); }
  }
}

/* --------------------------------------------------------------- modes */
const PRESETS = {
  overview: { pos: [0, 15, 38], look: [0, 1.5, -7], mode: 'dusk' },
  groves: { pos: [0, 6.5, 9], look: [0, 2.2, -14], mode: 'dusk' },
  props: { pos: [0, 4.4, 19], look: [0, 0.9, 4], mode: 'dusk' },
  propsL: { pos: [-9.5, 2.5, 10.5], look: [-9.5, 0.8, 4], mode: 'dusk' },
  propsR: { pos: [8.5, 2.6, 11], look: [8.5, 0.9, 4], mode: 'dusk' },
  shards: { pos: [0.4, 1.1, 11.2], look: [0, 0.6, 8.5], mode: 'dusk' },
  dungeon: { pos: [2.4, 1.7, DZ + 5.4], look: [-0.7, 0.95, DZ + 0.6], mode: 'dungeon' },
};
function setMode(mode) {
  const dusk = mode === 'dusk';
  sun.visible = hemi.visible = sky.visible = dusk;
  scene.environment = dusk ? envTex : null;
  scene.fog = dusk ? new THREE.FogExp2(DUSK_FOG, 0.0105) : new THREE.FogExp2('#030203', 0.06);
  scene.background = dusk ? DUSK_FOG.clone() : new THREE.Color('#000000');
  for (const l of labels) l.visible = dusk && q.get('labels') !== '0';
}
function go(name) {
  let p = PRESETS[name];
  if (!p && spots[name]) {
    const s = spots[name], sz = s.size, y0 = s.y0 || 0;
    const big = name.startsWith('veg:') && s.grove ? Math.max(sz, s.grove[2] * 0.9) : sz;
    p = { pos: [s.x + big * 0.35, y0 + sz * 0.55 + 0.2, s.z + big * 1.55 + 0.6], look: [s.x, y0 + sz * 0.4, s.z], mode: 'dusk' };
  }
  if (!p) p = PRESETS.overview;
  if (q.has('cam')) p = { ...p, pos: q.get('cam').split(',').map(Number) };
  if (q.has('look')) p = { ...p, look: q.get('look').split(',').map(Number) };
  camera.position.set(...p.pos);
  controls.target.set(...p.look);
  controls.update();
  setMode(p.mode);
  for (const b of document.querySelectorAll('#ui button[data-shot]')) b.classList.toggle('on', b.dataset.shot === name);
}

/* ------------------------------------------------------------------ ui */
const ui = document.getElementById('ui');
if (q.get('ui') === '0') ui.classList.add('hidden');
for (const [k, txt] of [['overview', 'Dusk overview'], ['groves', 'Groves'], ['props', 'Props'], ['propsL', 'Props L'], ['propsR', 'Props R'], ['shards', 'Shards'], ['dungeon', 'Dungeon corner']]) {
  const b = document.createElement('button'); b.textContent = txt; b.dataset.shot = k; b.onclick = () => go(k); ui.appendChild(b);
}
const hud = document.getElementById('hud');
hud.textContent = 'triangles\n' + Object.entries(tris).map(([k, v]) => `${k.padEnd(14)} ${String(v).padStart(6)}`).join('\n');
if (q.get('hud') === '1') hud.classList.remove('hidden');
const hb = document.createElement('button'); hb.textContent = 'Triangles'; hb.onclick = () => hud.classList.toggle('hidden'); ui.appendChild(hb);
window.addEventListener('keydown', (e) => {
  const keys = { 1: 'overview', 2: 'dungeon', 3: 'props', 4: 'shards', 5: 'groves' };
  if (keys[e.key]) go(keys[e.key]);
  if (e.key === 'h') hud.classList.toggle('hidden');
});
window.__tris = tris;

/* ---------------------------------------------------------- rendering */
let composer = null;
if (useBloom) {
  composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, camera));
  composer.addPass(new UnrealBloomPass(new THREE.Vector2(window.innerWidth / 2, window.innerHeight / 2), 0.55, 0.45, 0.82));
  composer.addPass(new OutputPass());
}
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer?.setSize(window.innerWidth, window.innerHeight);
});

go(q.get('shot') || 'overview');
const clock = new THREE.Clock();
let frames = 0;
function frame() {
  const t = frozenT ?? clock.getElapsedTime();
  for (const o of animated) o.userData.update(t);
  controls.update();
  if (composer) composer.render(); else renderer.render(scene, camera);
  if (++frames === 3) { window.__ready = true; window.__ms = performance.now(); }
  // With time frozen the picture is static: stop after a few frames (keeps headless captures cheap).
  if (frozenT !== null && frames >= 3 && !controls.__moved) return;
  requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
